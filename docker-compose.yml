services:
  postgres:
    image: postgres:17-alpine
    container_name: flowmind-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required for Docker Compose}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for Docker Compose}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required for Docker Compose}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required for Docker Compose}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowmind-redis
    restart: always
    ports:
      - "${REDIS_PORT:?REDIS_PORT is required for Docker Compose}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: flowmind-ollama
    restart: always
    ports:
      - "${OLLAMA_PORT:?OLLAMA_PORT is required for Docker Compose}:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  ollama_data:

